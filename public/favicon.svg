<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0918" />
      <stop offset="100%" stop-color="#140f28" />
    </linearGradient>
    
    <!-- Accent Gradient (Cyan to Indigo-Purple) -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="50%" stop-color="#7c3aed" />
      <stop offset="100%" stop-color="#ff007f" />
    </linearGradient>
    
    <!-- Inner Border Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#7c3aed" stop-opacity="0.1" />
    </linearGradient>

    <!-- Subtle Glow Filter -->
    <filter id="glow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background Card -->
  <rect width="64" height="64" rx="16" fill="url(#bgGrad)" />
  
  <!-- Glowing Border -->
  <rect x="1" y="1" width="62" height="62" rx="15" fill="none" stroke="url(#borderGrad)" stroke-width="1.5" />

  <!-- Futuristic "R" -->
  <g filter="url(#glow)">
    <!-- Vertical bar -->
    <path d="M22 47 V17" fill="none" stroke="url(#accentGrad)" stroke-width="6.5" stroke-linecap="round" />
    <!-- Loop & Leg -->
    <path d="M22 17 H34 C41.5 17, 46 22, 46 29 C46 36, 41.5 39.5, 34 39.5 H22" fill="none" stroke="url(#accentGrad)" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M30 39.5 L42 47" fill="none" stroke="url(#accentGrad)" stroke-width="6.5" stroke-linecap="round" />
  </g>
  
  <!-- Cybernetic Node Accent -->
  <circle cx="42" cy="47" r="2.5" fill="#00f2fe" />
</svg>
